name: repository-policy

on:
  pull_request:
    branches:
      - main
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: repository-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch all branches and tags
        run: >-
          git fetch --force --prune --no-recurse-submodules origin
          '+refs/heads/*:refs/remotes/origin/*'
          '+refs/tags/*:refs/tags/*'

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Prove cross-repository control-plane denial
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(
            curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              https://api.github.com/repos/lingfeng-xiao/GoodMnze.github.io/actions/secrets/public-key
          )"
          case "${status}" in
            403|404)
              echo "cross-repository control-plane access denied"
              ;;
            *)
              echo "cross-repository denial check failed with status ${status}" >&2
              exit 1
              ;;
          esac

      - name: Run repository policy tests
        run: python -m unittest discover -s tests/repository_policy -p "test_*.py" -v

      - name: Verify recovery provenance and current public boundary
        run: python -m tools.repository_policy.policy --repository .

      - name: Scan all reachable Git history
        run: python -m tools.repository_policy.policy --repository . --scan-history

      - name: Deliberate negative control
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[negative-control]') }}
        run: python -m tools.repository_policy.policy --negative-control
