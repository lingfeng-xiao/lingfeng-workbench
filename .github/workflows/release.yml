name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable v* tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish immutable artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workbench-web/package-lock.json

      - name: Validate tag and version alignment
        id: version
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${REQUESTED_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease." >&2
            exit 1
          fi
          if ! git show-ref --tags --verify --quiet "refs/tags/${REQUESTED_TAG}"; then
            echo "Tag ${REQUESTED_TAG} does not exist." >&2
            exit 1
          fi
          if [[ "$(git rev-list -n 1 "${REQUESTED_TAG}")" != "$(git rev-parse HEAD)" ]]; then
            echo "Checked-out commit is not the commit named by ${REQUESTED_TAG}." >&2
            exit 1
          fi

          expected_version="${REQUESTED_TAG#v}"
          root_version="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          service_version="$(mvn -q -f workbench-service/pom.xml -DforceStdout help:evaluate -Dexpression=project.version)"
          node_version="$(mvn -q -f workbench-node/pom.xml -DforceStdout help:evaluate -Dexpression=project.version)"
          web_version="$(node -p "require('./workbench-web/package.json').version")"

          for actual_version in "${root_version}" "${service_version}" "${node_version}" "${web_version}"; do
            if [[ "${actual_version}" != "${expected_version}" ]]; then
              echo "Version ${actual_version} does not match tag ${REQUESTED_TAG}." >&2
              exit 1
            fi
          done

          prerelease=false
          if [[ "${expected_version}" == *-* ]]; then
            prerelease=true
          fi
          echo "tag=${REQUESTED_TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${expected_version}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

      - name: Lint versioned contracts
        run: >-
          npx --yes @redocly/cli@2.46.2 lint
          doc/contracts/client-api.openapi.yaml
          doc/contracts/node-protocol.openapi.yaml

      - name: Build and test Service and Node
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Install locked Web dependencies
        working-directory: workbench-web
        run: npm ci

      - name: Lint and test Web production build
        working-directory: workbench-web
        run: |
          npm run lint
          npm test
          npm audit --omit=dev --audit-level=high

      - name: Assemble release files
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t service_jars < <(find workbench-service/target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*')
          mapfile -t node_jars < <(find workbench-node/target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*')
          if [[ "${#service_jars[@]}" -ne 1 || "${#node_jars[@]}" -ne 1 ]]; then
            echo "Expected exactly one executable JAR from each Java module." >&2
            exit 1
          fi
          cp "${service_jars[0]}" "dist/workbench-service-${VERSION}.jar"
          cp "${node_jars[0]}" "dist/workbench-node-${VERSION}.jar"
          (
            cd dist
            sha256sum ./*.jar > SHA256SUMS
          )

      - name: Upload verified workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lingfeng-workbench-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub prerelease
        if: steps.version.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: >-
          gh release create "${TAG}" dist/*
          --verify-tag
          --prerelease
          --title "${TAG}"
          --generate-notes

      - name: Create GitHub release
        if: steps.version.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: >-
          gh release create "${TAG}" dist/*
          --verify-tag
          --title "${TAG}"
          --generate-notes
