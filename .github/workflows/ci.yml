name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: OpenAPI contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Lint versioned contracts
        run: >-
          npx --yes @redocly/cli@2.46.2 lint
          doc/contracts/client-api-v2.openapi.yaml
          doc/contracts/node-protocol-v2.openapi.yaml
          doc/contracts/task-api-v1.openapi.yaml

  java:
    name: Java 21 reactor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test Service and Node
        run: mvn --batch-mode --no-transfer-progress clean verify

  web:
    name: Web lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workbench-web
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workbench-web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test production build
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  windows-wrapper:
    name: Windows wrapper (${{ matrix.module }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module:
          - workbench-service
          - workbench-node
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Verify Maven Wrapper
        working-directory: ${{ matrix.module }}
        shell: pwsh
        run: .\mvnw.cmd --batch-mode --version
