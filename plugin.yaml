name: lingfeng-workbench
version: 0.1.0
manifest_version: 2
api_version: 1
description: Hermes control plane for office-PC agent runtimes
author: lingfeng
kind: standalone
provides_tools:
  - lingfeng_create_work_item
  - lingfeng_status
  - lingfeng_resolve_interaction
config_schema:
  board: {type: str, default: "lingfeng-workbench", description: "Hermes Kanban board slug"}
  external_assignee: {type: str, default: "lingfeng-external", description: "Non-profile lane claimed by office nodes"}
  notification_target: {type: str, default: "weixin", description: "Hermes send_message target; blank disables proactive notifications"}
